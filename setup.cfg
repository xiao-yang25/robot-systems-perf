[metadata]
name = robot-systems-perf
version = 0.5.0
description = Linux process and thread resource monitoring for robot systems

[options]
packages = find:
python_requires = >=3.9
include_package_data = False

[options.packages.find]
include = perfkit

[options.entry_points]
console_scripts =
    robot-perf-monitor = perfkit.monitor:main
    robot-perf-intake = perfkit.intake:main
